[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cenyslovensko-bindings"
version = "0.1.0"
description = "Python bindings for cenyslovensko RPC server"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["cenyslovensko_bindings*"]

[tool.setuptools.package-data]
cenyslovensko_bindings = ["bin/*"]
