name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-version:
    name: Verify tag matches crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag == Cargo.toml versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Git tag version: $TAG"

          check() {
            local crate="$1" file="$2"
            local ver
            ver=$(grep -m1 '^version' "$file" | sed 's/version = "\(.*\)"/\1/')
            if [ "$ver" != "$TAG" ]; then
              echo "ERROR: $crate version $ver does not match tag v$TAG"
              exit 1
            fi
            echo "OK: $crate = $ver"
          }

          check cenyslovensko            cenyslovensko_api/Cargo.toml
          check cenyslovensko_web_client cenyslovensko_web_client/Cargo.toml
          check cenyslovensko_version_api cenyslovensko_version_api/Cargo.toml
          check cenyslovensko_rpc_server  cenyslovensko_rpc_server/Cargo.toml

  build:
    name: Build (${{ matrix.target }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write      # required for SLSA provenance signing
      attestations: write  # required to write provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cenyslovensko_rpc_server
            archive_suffix: linux-x86_64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: cenyslovensko_rpc_server
            archive_suffix: macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cenyslovensko_rpc_server
            archive_suffix: macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cenyslovensko_rpc_server.exe
            archive_suffix: windows-x86_64.zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p cenyslovensko_rpc_server

      # Generate SLSA provenance for the binary before packaging
      - name: Attest binary provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/${{ matrix.bin }}
          ARCHIVE=cenyslovensko_rpc_server-${{ matrix.archive_suffix }}
          # Bundle binary + provenance bundle in one archive
          cp "${{ steps.attest.outputs.bundle-path }}" provenance.intoto.jsonl
          tar -czf "$ARCHIVE" -C "$(dirname $BIN)" "$(basename $BIN)" -C "$GITHUB_WORKSPACE" provenance.intoto.jsonl
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BIN = "target\${{ matrix.target }}\release\${{ matrix.bin }}"
          $ARCHIVE = "cenyslovensko_rpc_server-${{ matrix.archive_suffix }}"
          Copy-Item "${{ steps.attest.outputs.bundle-path }}" -Destination "provenance.intoto.jsonl"
          Compress-Archive -Path $BIN, "provenance.intoto.jsonl" -DestinationPath $ARCHIVE
          "ARCHIVE=$ARCHIVE" | Out-File -FilePath $Env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cenyslovensko_rpc_server-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
