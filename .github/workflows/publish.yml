name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Verify tag matches crate versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag == Cargo.toml versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Git tag version: $TAG"

          check() {
            local crate="$1" file="$2"
            local ver
            ver=$(grep -m1 '^version' "$file" | sed 's/version = "\(.*\)"/\1/')
            if [ "$ver" != "$TAG" ]; then
              echo "ERROR: $crate version $ver does not match tag v$TAG"
              exit 1
            fi
            echo "OK: $crate = $ver"
          }

          check cenyslovensko            cenyslovensko_api/Cargo.toml
          check cenyslovensko_web_client cenyslovensko_web_client/Cargo.toml
          check cenyslovensko_version_api cenyslovensko_version_api/Cargo.toml
          check cenyslovensko_rpc_server  cenyslovensko_rpc_server/Cargo.toml

  publish-web-client:
    name: Publish cenyslovensko_web_client
    needs: check-version
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-publish-
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cenyslovensko_web_client

  publish-version-api:
    name: Publish cenyslovensko_version_api
    needs: publish-web-client
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-publish-
      - name: Wait for index propagation
        run: sleep 30
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cenyslovensko_version_api

  publish-vendor-api:
    name: Publish cenyslovensko_vendor_api
    needs: publish-web-client
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-publish-
      - name: Wait for index propagation
        run: sleep 30
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cenyslovensko_vendor_api

  publish:
    name: Publish cenyslovensko
    needs: [publish-vendor-api, publish-version-api]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-publish-
      - name: Wait for index propagation
        run: sleep 30
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cenyslovensko_api

