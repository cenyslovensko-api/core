name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish cenyslovensko
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write      # required for OIDC trusted publishing
      attestations: write  # required to write GitHub attestations

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ubuntu-cargo-publish-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-publish-
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p cenyslovensko --no-verify

