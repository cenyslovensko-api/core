[package]
name = "cenyslovensko"
edition = "2024"
description = "Umbrella crate for the CenySlovensko API — feature-gate individual sub-crates."

[features]
default = []
web_client = ["dep:cenyslovensko_web_client"]
version = ["web_client", "dep:cenyslovensko_version_api"]

[dependencies]
cenyslovensko_web_client = { path = "../cenyslovensko_web_client", optional = true }
cenyslovensko_version_api = { path = "../cenyslovensko_version_api", optional = true, features = ["get_version"] }
