[package]
name = "cenyslovensko_api"
version = "0.1.8"
edition = "2024"
description = "Umbrella crate for the CenySlovensko API - feature-gate individual sub-crates."
license.workspace = true
repository.workspace = true
publish = true

[features]
default = []
full = ["web_client", "version", "vendor"]
web_client = ["dep:cenyslovensko_web_client"]
version = ["web_client", "dep:cenyslovensko_version_api"]
vendor = ["web_client", "dep:cenyslovensko_vendor_api"]

[dependencies]
cenyslovensko_web_client = { path = "../cenyslovensko_web_client", optional = true, version = "0.1.8" }
cenyslovensko_version_api = { path = "../cenyslovensko_version_api", optional = true, version = "0.1.8" }
cenyslovensko_vendor_api = { path = "../cenyslovensko_vendor_api", optional = true, version = "0.1.8" }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "api_bench"
harness = false
required-features = ["web_client"]
