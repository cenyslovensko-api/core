[package]
name = "cenyslovensko_rpc_server"
version = "0.1.4"
edition = "2024"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
cenyslovensko_api = { path = "../cenyslovensko_api", features = ["full"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "rpc_server_bench"
harness = false
