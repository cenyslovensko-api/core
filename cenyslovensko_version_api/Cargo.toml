[package]
name = "cenyslovensko_version_api"
version = "0.1.1"
edition = "2024"
description = "Version API client for CenySlovensko — fetch the current API version over HTTP."
license.workspace = true
repository.workspace = true

[features]
default = ["get_version"]
get_version = []

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
derive_more = { workspace = true, features = ["display", "eq", "constructor"] }
miette = { workspace = true }
anyhow = { workspace = true }
cenyslovensko_web_client = { path = "../cenyslovensko_web_client", version = "0.1.1" }

[dev-dependencies]
httpmock = { workspace = true }
