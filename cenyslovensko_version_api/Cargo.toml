[package]
name = "cenyslovensko_version_api"
version = "0.1.11"
edition = "2024"
description = "Version API client for CenySlovensko - fetch the current API version over HTTP."
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
derive_more = { workspace = true, features = ["display", "eq", "constructor", "error"] }
miette = { workspace = true }
cenyslovensko_web_client = { path = "../cenyslovensko_web_client", version = "0.1.11" }

[dev-dependencies]
httpmock = { workspace = true }
criterion = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[[bench]]
name = "version_api_bench"
harness = false
